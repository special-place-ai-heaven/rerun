name: CI

on:
  push:
    branches: [dev, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs in the open source repository and the special-place-ai-heaven fork, not in a private clone.
    # The fork runs it only for its own branches, so code from someone else's pull request never
    # runs on a self-hosted runner. It runs GitHub-hosted unless the repository variable CI_RUNS_ON
    # names another runner as JSON, e.g. {"group":"aap-crrr","labels":["self-hosted","linux","heavy"]}.
    if: >-
      github.repository == 'rerun-build/rerun' ||
      (github.repository == 'special-place-ai-heaven/rerun' &&
       (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    name: Typecheck, lint, tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - run: pnpm -r --if-present ts-check
      - run: pnpm --filter rerun lint
      # Capped: the self-hosted host is shared, and one worker per core starves the other jobs on it.
      - run: pnpm --filter rerun run test --maxWorkers=8
      - run: pnpm --filter rerun-engine run test --maxWorkers=8

  migrations:
    # Runs in the open source repository and its fork, not in a private clone of it. Hosted: it
    # needs Docker, which the fork's self-hosted pool (runners inside a container) does not offer.
    if: github.repository == 'rerun-build/rerun' || github.repository == 'special-place-ai-heaven/rerun'
    name: Migrations and seed on a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: supabase db start
      - run: supabase db reset --local

  # The images take ~20 minutes to build: a pull request only builds them when it touches what
  # goes into them beyond the code the other jobs already check, and every push to master and
  # staging builds them anyway before anything ships.
  docker-inputs:
    if: (github.repository == 'rerun-build/rerun' || github.repository == 'special-place-ai-heaven/rerun') && github.event_name == 'pull_request'
    name: Docker inputs changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)Dockerfile$|(^|/)\.dockerignore$|^docker-compose\.yml$|(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^apps/ui/next\.config\.|^\.github/workflows/ci\.yml$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  images:
    # Runs in the open source repository only, not in a private clone of it.
    needs: docker-inputs
    if: >-
      always() && (github.repository == 'rerun-build/rerun' || github.repository == 'special-place-ai-heaven/rerun') &&
      ((github.event_name == 'push' && github.ref != 'refs/heads/dev') || needs.docker-inputs.outputs.changed == 'true')
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/engine/Dockerfile
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ui/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54421
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
