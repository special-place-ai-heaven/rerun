name: CI

on:
  push:
    branches: [dev, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs in the open source repository and the special-place-ai-heaven fork, not in a private clone.
    # The fork runs it only for its own branches, so code from someone else's pull request never
    # runs on a self-hosted runner. The fork uses the org's self-hosted heavy pool unless the
    # repository variable TP_RUNS_ON names another runner as JSON, e.g. "ubuntu-latest" (with quotes).
    if: >-
      github.repository == 'rerun-build/rerun' ||
      (github.repository == 'special-place-ai-heaven/rerun' &&
       (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    name: Typecheck, lint, tests
    runs-on: ${{ fromJSON(vars.TP_RUNS_ON || (github.repository == 'special-place-ai-heaven/rerun' && '{"group":"aap-crrr","labels":["self-hosted","linux","heavy"]}' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - run: pnpm -r --if-present ts-check
      # Every package that has a lint script: the app, the engine and the contracts package.
      - run: pnpm -r --if-present lint
      # Capped: the self-hosted host is shared, and one worker per core starves the other jobs on it.
      - run: pnpm --filter rerun run test --maxWorkers=8
      - run: pnpm --filter rerun-engine run test --maxWorkers=8

  migrations:
    # Runs in the open source repository and its fork, not in a private clone of it. Hosted: it
    # needs Docker, which the fork's self-hosted pool (runners inside a container) does not offer.
    if: github.repository == 'rerun-build/rerun' || github.repository == 'special-place-ai-heaven/rerun'
    name: Migrations and seed on a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: supabase db start
      - run: supabase db reset --local
      - name: "Engine key replacement: database rehearsal"
        run: |
          set -eu
          # A made-up key for this throwaway database, not a secret: "feed" sixteen times, 64 hex characters.
          key=feedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeed
          db() { docker exec -i -u postgres supabase_db_rerun psql -X -q -t -A -v ON_ERROR_STOP=1 -d postgres; }
          printf '%s\n' "insert into public.engine_pool (engine_host, engine_api_key, status) values ('http://engine:3000', '$key', 'claimed');" | db
          printf "RERUN_ENGINE_API_KEY='%s'\n" "$key" > .env
          out=$(SUPABASE_DB_CONTAINER=supabase_db_rerun sh deploy/vps/rotate-engine-key.sh check)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fxq 'db-rows-holding-current-key 1 (expect 1)'
          printf '%s\n' "$out" | grep -Fxq 'db-rehearsal swapped (rolled back)'
          # The lookup of triggers and publications must answer with names or "none", never "error".
          printf '%s\n' "$out" | grep -Eq '^db-triggers-on-engine_pool [A-Za-z0-9_,]+$'
          printf '%s\n' "$out" | grep -Eq '^db-publications-with-engine_pool [A-Za-z0-9_,]+$'
          if printf '%s\n' "$out" | grep -Eq '^db-(triggers|publications)-.* error$'; then exit 1; fi
          test "$(printf '%s\n' "select count(*) from public.engine_pool where engine_api_key = '$key';" | db)" = 1

  # The images take ~20 minutes to build: a pull request only builds them when it touches what
  # goes into them beyond the code the other jobs already check, and every push to master and
  # staging builds them anyway before anything ships.
  docker-inputs:
    if: (github.repository == 'rerun-build/rerun' || github.repository == 'special-place-ai-heaven/rerun') && github.event_name == 'pull_request'
    name: Docker inputs changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)Dockerfile$|(^|/)\.dockerignore$|^docker-compose\.yml$|(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^apps/ui/next\.config\.|^\.github/workflows/ci\.yml$'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  images:
    # Runs in the open source repository only, not in a private clone of it.
    needs: docker-inputs
    # Not always(): that also ignores the cancel a newer commit sends, and a superseded run then
    # builds on for 20 minutes while the new one waits behind it.
    if: >-
      !cancelled() && (github.repository == 'rerun-build/rerun' || github.repository == 'special-place-ai-heaven/rerun') &&
      ((github.event_name == 'push' && github.ref != 'refs/heads/dev') || needs.docker-inputs.outputs.changed == 'true')
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/engine/Dockerfile
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ui/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54421
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
