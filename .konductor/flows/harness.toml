# Konductor flow for a Linear issue labeled Harness Use Case: move the card to In Progress, replay the case, plan (approved by the flow), review, fix the review
# (plan approved by you), summary on the issue, PR, wait for your merge, then close the card.
# Format: https://github.com/ClementJanssens/konductor/blob/master/docs/flows.md
name = "Harness"
match = { labels = ["Harness Use Case"] }

[[steps]]
id = "investigate"
title = "Investigate"
attach_issue = true
prompt = """
Avant toute chose, passe la carte Linear {{issue.identifier}} en In Progress avec le MCP Linear si elle n'y est pas déjà.

/harness-use-case {{issue.url}}

Le ticket Linear complet (description, images) est dans {{issue.file}}.

Tu peux te connecter en SSH à l'engine pour diagnostiquer la cause, et lire tous les logs dont tu as besoin
dans PostHog ou dans Supabase. Fais une analyse complète et essaye de reproduire le cas au maximum.
"""

[[steps]]
id = "plan"
title = "Plan the fix"
plan = true
approve = "auto"
prompt = "Planifie le fix à partir du cas rejoué : la cause, la couche où le corriger (hub, prompt du moteur, template), et la mesure avant / après qui le prouve."

[[steps]]
id = "review"
title = "Review"
kind = "review"

[[steps]]
id = "fixes"
title = "Review fixes"
chat = "review"
plan = true
approve = "human"
comments = ["blocking", "major", "minor", "nit"]
skip_if_no_comments = true
prompt = """
Voici les {{comments.count}} remarques de la review, chacune avec sa sévérité.
Planifie la correction de toutes les remarques blocking et major, et des minor / nit qui sont des quick wins.
Pour chaque remarque que tu écartes, dis pourquoi.
"""

[[steps]]
id = "summary"
title = "Summary"
chat = "summary"
linear_comment = true
prompt = """
Lis {{issue.file}} et le diff de ce workspace (GetWorkspaceDiff). Ne crée ni commit, ni push, ni pull request :
l'étape suivante ouvre la PR.
Écris un résumé pour la personne qui va relire et merger : le cas client, la cause, la couche corrigée et comment,
la mesure avant / après, et ce qu'il reste à vérifier avant de merger. Court, en français.
"""

[[steps]]
id = "pr"
title = "Create PR"
kind = "create_pr"

[[steps]]
id = "merge"
title = "Merge"
kind = "wait_merge"

[[steps]]
id = "close"
title = "Close the card"
chat = "summary"
linear_comment = true
prompt = """
La PR de {{issue.identifier}} est mergée. Passe la carte Linear en Done avec le MCP Linear si elle n'y est pas déjà,
puis écris sa mise à jour finale, postée telle quelle sur la carte : la PR mergée, la cause du comportement, ce qui a
été corrigé et la mesure avant / après. Court, en français, sans clé, token ni contenu privé du client.
"""
