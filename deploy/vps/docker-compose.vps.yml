# Rerun on a server whose Traefik (docker provider, `websecure` entrypoint, `letsencrypt` resolver)
# already serves HTTPS for other projects. The app and the engine get one address each and publish no
# port of their own: Traefik reaches them directly, and nothing else is opened.
#
# From the clone on the server, once:
#   sh deploy/vps/make-env.sh      # writes .env, COMPOSE_FILE included, so plain `docker compose` uses this file
# then, to start or update:
#   git pull && docker compose pull && docker compose up -d
#
# The images come from GitHub (.github/workflows/images.yml), never built here: the app image bakes
# NEXT_PUBLIC_APP_URL from the repository variable, which must match RERUN_APP_HOST. The server logs in
# once with `docker login ghcr.io` (a read:packages token) while the packages are private.
#
# Web reading and search without paid services: `webgate` answers the app exactly as Firecrawl
# (/v2/scrape, /v2/map, /v2/search) and Brave Search (/res/v1/web/search) would, and does the work with
# the self-hosted crawl4ai (CRAWL4AI_URL, CRAWL4AI_TOKEN) and with `searxng` below. Both are reached
# only by name on the compose network: no port, no Traefik route. The app's own .env keys for Firecrawl
# and Brave are overridden below, so pages and searches go through webgate with WEBGATE_KEY.
# Add the keys to an existing .env once with: sudo sh deploy/vps/add-web.sh
services:
  app:
    ports: !reset []
    labels:
      - traefik.enable=true
      - "traefik.http.routers.rerun-app.rule=Host(`${RERUN_APP_HOST:?set RERUN_APP_HOST in .env}`)"
      - traefik.http.routers.rerun-app.entrypoints=websecure
      - traefik.http.routers.rerun-app.tls.certresolver=letsencrypt
      - traefik.http.services.rerun-app.loadbalancer.server.port=3000
    # `environment` wins over env_file, so these replace any Firecrawl or Brave key in .env.
    environment:
      RERUN_FIRECRAWL_BASE_URL: http://webgate:8080
      FIRECRAWL_API_KEY: ${WEBGATE_KEY}
      BRAVE_SEARCH_API_KEY: ${WEBGATE_KEY}
      RERUN_BRAVE_SEARCH_URL: http://webgate:8080/res/v1/web/search

  engine:
    ports: !reset []
    labels:
      - traefik.enable=true
      - "traefik.http.routers.rerun-engine.rule=Host(`${RERUN_ENGINE_HOST:?set RERUN_ENGINE_HOST in .env}`)"
      - traefik.http.routers.rerun-engine.entrypoints=websecure
      - traefik.http.routers.rerun-engine.tls.certresolver=letsencrypt
      - traefik.http.services.rerun-engine.loadbalancer.server.port=3000

  webgate:
    image: node:22-alpine
    command: node /srv/webgate/server.mjs
    volumes:
      - ./deploy/vps/webgate:/srv/webgate:ro
    environment:
      WEBGATE_KEY: ${WEBGATE_KEY:?set WEBGATE_KEY in .env (sudo sh deploy/vps/add-web.sh)}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-https://crawl4ai.robagentic.tech}
      CRAWL4AI_TOKEN: ${CRAWL4AI_TOKEN:?set CRAWL4AI_TOKEN in .env (sudo sh deploy/vps/add-web.sh)}
      SEARXNG_URL: http://searxng:8080
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./deploy/vps/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (sudo sh deploy/vps/add-web.sh)}
    restart: unless-stopped
