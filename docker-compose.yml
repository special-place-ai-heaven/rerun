# Rerun on one machine: the web app and the engine of your first workspace.
#
#   cp .env.example .env && node scripts/self-host-check.mjs   # fills the secrets, checks the rest
#   docker compose pull && docker compose up -d                 # the images the fork's CI built
#   docker compose up -d --build                                # or build them on this machine
#
# The pulled images come from .github/workflows/images.yml. RERUN_IMAGE_TAG in .env picks them:
# dev (default, the latest of the dev branch) or sha-<7 chars> for one exact commit. The app image
# carries the NEXT_PUBLIC_* values of the repository variables it was built with.
#
# Supabase runs outside this file: a free project on supabase.com, or `npx supabase start` on this
# machine (then add `--profile local-supabase`). See https://docs.rerun.build/self-host.
name: rerun

services:
  app:
    image: ghcr.io/special-place-ai-heaven/rerun-app:${RERUN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
        NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
    env_file: .env
    environment:
      # The engine below goes to the first workspace that needs one.
      RERUN_ENGINE_URL: http://engine:3000
      RERUN_ENGINE_API_KEY: ${RERUN_ENGINE_API_KEY}
      # Where a browser reaches the engine below, to watch a coworker's screen.
      RERUN_ENGINE_BROWSER_URL: ${RERUN_ENGINE_BROWSER_URL:-http://localhost:3001}
    ports:
      - "${RERUN_APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  engine:
    image: ghcr.io/special-place-ai-heaven/rerun-engine:${RERUN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    environment:
      RERUN_API_KEY: ${RERUN_ENGINE_API_KEY}
      RERUN_HUB_BASE_URL: http://app:3000
      RERUN_LOG_LEVEL: ${RERUN_LOG_LEVEL:-info}
    ports:
      - "${RERUN_ENGINE_PORT:-3001}:3000"
    volumes:
      - engine-data:/data
    # The engine calls your own model when you connect one: Ollama or LM Studio on this machine
    # answer it at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 2 GB of shared memory keeps Chromium from crashing on heavy pages.
    shm_size: 2gb
    restart: unless-stopped

  # Only with `npx supabase start` on this machine: makes the local Supabase answer on the same
  # address inside the app container as in your browser (http://localhost:54421).
  supabase-bridge:
    image: alpine/socat:1.8.0.3
    profiles: ["local-supabase"]
    network_mode: "service:app"
    depends_on: [app]
    command: TCP-LISTEN:54421,fork,reuseaddr TCP:host.docker.internal:54421
    restart: unless-stopped

volumes:
  engine-data:
